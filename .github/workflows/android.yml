name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.1 (пусто — без релиза)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия приложения
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION_NAME=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Ключ подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Секрета KEYSTORE_BASE64 нет: соберу только отладочный APK."
          fi

      - name: Сборка отладочного APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сборка подписанных APK и AAB
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew assembleRelease bundleRelease

      - name: Отладочный APK
        uses: actions/upload-artifact@v4
        with:
          name: alcoCube-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Подписанный APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alcoCube-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: AAB для Google Play
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alcoCube-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Архив с игрой (APK + html)
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p dist/alcoCube
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/alcoCube/alcoCube-$VERSION_NAME.apk"
          else
            cp app/build/outputs/apk/debug/*.apk "dist/alcoCube/alcoCube-$VERSION_NAME.apk"
          fi
          cp web/index.html dist/alcoCube/index.html
          (cd dist && zip -r "alcoCube-$VERSION_NAME.zip" alcoCube)

      - name: Релиз с подписанными файлами
        if: env.RELEASE_TAG != '' && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            dist/*.zip

      - name: Релиз с отладочным APK
        if: env.RELEASE_TAG != '' && steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            dist/*.zip
